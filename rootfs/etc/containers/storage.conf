# Native overlay on the per-dev-container volume (~/.local/share/containers).
# No mount_program: fuse-overlayfs is not installed and /dev/fuse is not needed.
# Without the volume, podman fails loudly (overlay on overlay) instead of silently using fuse.

[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mountopt = "nodev"
