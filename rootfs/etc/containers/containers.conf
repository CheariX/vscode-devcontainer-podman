# Defaults for Podman nested in a rootless container (based on the official Podman image).

[containers]
# netns is left at the rootless default (pasta): every inner container gets its own network
# namespace, so -p, podman networks and compose service names work. Needs /dev/net/tun (mounted via the image label),
# and podman networks need a writable /proc/sys (unmask=/proc/sys in the image label).
# The outer container already is a user namespace with all IDs we have; no further one.
userns = "host"
# Own IPC/UTS/cgroup namespaces need privileges the nested setup does not have
ipcns = "host"
utsns = "host"
cgroupns = "host"
# No delegated cgroup in a nested rootless container
cgroups = "disabled"
log_driver = "k8s-file"
# Mounting a fresh procfs is blocked by the outer container's masked paths
volumes = ["/proc:/proc"]
default_sysctls = []

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
# `docker compose` runs `podman compose`, which otherwise prints a notice on every call
compose_warning_logs = false
